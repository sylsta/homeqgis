name: Build plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m compileall -q homeqgis scripts pi

      - name: Check undefined names
        run: python3 scripts/check_names.py

      - name: Check translations
        run: python3 scripts/check_translations.py

      - name: Install Qt tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qttools5-dev-tools python3-pyqt5

      - name: Check Qt Designer forms
        run: python3 scripts/check_ui.py

      - name: Compile translations
        run: scripts/compile_translations.sh

      - name: Build the user manual
        run: |
          pip install -q "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
          mkdocs build --strict -d site
          # also inside the plugin, opened by its "User manual" entry
          rm -rf homeqgis/doc && cp -r site homeqgis/doc

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

      - name: Package plugin
        run: |
          mkdir -p dist
          zip -r dist/homeqgis.zip homeqgis \
            -x '*__pycache__*' 'homeqgis/i18n/*.ts'

      - uses: actions/upload-artifact@v4
        with:
          name: homeqgis
          path: dist/homeqgis.zip

  # The manual on GitHub Pages: https://sylsta.github.io/homeqgis/
  pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        # Until Pages is turned on (Settings › Pages › Source: GitHub Actions), this
        # step fails: the plugin's build stays green all the same.
        continue-on-error: true
